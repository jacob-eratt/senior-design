<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 8 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#404040"/>
    </marker>
    <marker id="ab" viewBox="0 0 8 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2F5597"/>
    </marker>
    <marker id="ao" viewBox="0 0 8 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C55A11"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="480" fill="#FFFFFF"/>
  <text x="15" y="45" font-size="16" font-weight="bold" fill="#000">(a) Accelerator top level</text>
  <rect x="15" y="90" width="110" height="330" rx="6" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.5"/>
  <text x="70" y="240" font-size="14" font-weight="bold" text-anchor="middle">Zynq PS</text>
  <text x="70" y="262" font-size="12" text-anchor="middle">CPU +</text>
  <text x="70" y="279" font-size="12" text-anchor="middle">AXI DMA</text>
  <rect x="190" y="90" width="160" height="80" rx="6" fill="#E8F0FB" stroke="#2F5597" stroke-width="1.5"/>
  <text x="270" y="115" font-size="14" font-weight="bold" text-anchor="middle">Control Registers</text>
  <text x="270" y="134" font-size="12" font-family="Consolas, Courier New, monospace" text-anchor="middle">ws_axi_regs</text>
  <text x="270" y="155" font-size="11" fill="#595959" text-anchor="middle">config · start · status</text>
  <rect x="190" y="215" width="160" height="80" rx="6" fill="#E8F0FB" stroke="#2F5597" stroke-width="1.5"/>
  <text x="270" y="240" font-size="14" font-weight="bold" text-anchor="middle">Memory Loader</text>
  <text x="270" y="259" font-size="12" font-family="Consolas, Courier New, monospace" text-anchor="middle">ws_axis_loader</text>
  <text x="270" y="280" font-size="11" fill="#595959" text-anchor="middle">weight + input memory</text>
  <rect x="190" y="340" width="160" height="80" rx="6" fill="#E8F0FB" stroke="#2F5597" stroke-width="1.5"/>
  <text x="270" y="365" font-size="14" font-weight="bold" text-anchor="middle">Output Module</text>
  <text x="270" y="384" font-size="12" font-family="Consolas, Courier New, monospace" text-anchor="middle">ws_axis_output</text>
  <text x="270" y="405" font-size="11" fill="#595959" text-anchor="middle">packs results for DMA</text>
  <rect x="430" y="90" width="195" height="330" rx="6" fill="#F2F2F2" stroke="#404040" stroke-width="1.5"/>
  <text x="527" y="113" font-size="14" font-weight="bold" text-anchor="middle">Tile Engine</text>
  <text x="527" y="132" font-size="12" font-family="Consolas, Courier New, monospace" text-anchor="middle">ws_tile_engine</text>
  <rect x="447" y="150" width="160" height="120" rx="6" fill="#DDEBF7" stroke="#2F5597" stroke-width="2"/>
  <text x="527" y="185" font-size="14" font-weight="bold" text-anchor="middle">Systolic Array</text>
  <text x="527" y="204" font-size="12" font-family="Consolas, Courier New, monospace" text-anchor="middle">ws_mxu</text>
  <text x="527" y="228" font-size="12" text-anchor="middle">27 × 26 = 702 PEs</text>
  <text x="527" y="248" font-size="11" fill="#595959" text-anchor="middle">see (b)</text>
  <rect x="447" y="320" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#404040" stroke-width="1.5"/>
  <text x="527" y="352" font-size="14" font-weight="bold" text-anchor="middle">Result Memory</text>
  <text x="527" y="372" font-size="12" text-anchor="middle">26 × 64 INT32</text>
  <line x1="125" y1="130" x2="188" y2="130" stroke="#404040" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="157" y="122" font-size="10" text-anchor="middle">AXI-Lite</text>
  <line x1="125" y1="255" x2="188" y2="255" stroke="#404040" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="157" y="247" font-size="10" text-anchor="middle">AXI-Stream</text>
  <line x1="190" y1="380" x2="127" y2="380" stroke="#404040" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="157" y="372" font-size="10" text-anchor="middle">AXI-Stream</text>
  <line x1="352" y1="130" x2="428" y2="130" stroke="#404040" stroke-width="1.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="390" y="122" font-size="10" text-anchor="middle">start / status</text>
  <line x1="350" y1="255" x2="445" y2="255" stroke="#404040" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="388" y="247" font-size="10" text-anchor="middle">weights / inputs</text>
  <line x1="447" y1="380" x2="352" y2="380" stroke="#404040" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="397" y="372" font-size="10" text-anchor="middle">results</text>
  <line x1="527" y1="270" x2="527" y2="318" stroke="#404040" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="535" y="298" font-size="10">column sums</text>
  <line x1="660" y1="20" x2="660" y2="460" stroke="#D9D9D9" stroke-width="1"/>
  <text x="680" y="45" font-size="16" font-weight="bold" fill="#000">(b) Weight-stationary systolic array</text>
  <text x="919" y="72" font-size="12" text-anchor="middle">26 columns (output channels)</text>
  <text x="694" y="230" font-size="12" text-anchor="middle" transform="rotate(-90 694 230)">27 rows (reduction dimension)</text>
  <g font-size="11" fill="#C55A11" text-anchor="middle">
    <text x="799" y="88">0</text>
    <text x="889" y="88">0</text>
    <text x="1039" y="88">0</text>
  </g>
  <g stroke="#C55A11" stroke-width="1.5">
    <line x1="799" y1="92" x2="799" y2="108" marker-end="url(#ao)"/>
    <line x1="889" y1="92" x2="889" y2="108" marker-end="url(#ao)"/>
    <line x1="1039" y1="92" x2="1039" y2="108" marker-end="url(#ao)"/>
    <line x1="799" y1="156" x2="799" y2="183" marker-end="url(#ao)"/>
    <line x1="889" y1="156" x2="889" y2="183" marker-end="url(#ao)"/>
    <line x1="1039" y1="156" x2="1039" y2="183" marker-end="url(#ao)"/>
    <line x1="799" y1="231" x2="799" y2="252" marker-end="url(#ao)"/>
    <line x1="889" y1="231" x2="889" y2="252" marker-end="url(#ao)"/>
    <line x1="1039" y1="231" x2="1039" y2="252" marker-end="url(#ao)"/>
    <line x1="799" y1="282" x2="799" y2="303" marker-end="url(#ao)"/>
    <line x1="889" y1="282" x2="889" y2="303" marker-end="url(#ao)"/>
    <line x1="1039" y1="282" x2="1039" y2="303" marker-end="url(#ao)"/>
    <line x1="799" y1="351" x2="799" y2="375" marker-end="url(#ao)"/>
    <line x1="889" y1="351" x2="889" y2="375" marker-end="url(#ao)"/>
    <line x1="1039" y1="351" x2="1039" y2="375" marker-end="url(#ao)"/>
  </g>
  <g stroke="#2F5597" stroke-width="1.5">
    <line x1="725" y1="133" x2="768" y2="133" marker-end="url(#ab)"/>
    <line x1="725" y1="208" x2="768" y2="208" marker-end="url(#ab)"/>
    <line x1="725" y1="328" x2="768" y2="328" marker-end="url(#ab)"/>
    <line x1="828" y1="133" x2="858" y2="133" marker-end="url(#ab)"/>
    <line x1="828" y1="208" x2="858" y2="208" marker-end="url(#ab)"/>
    <line x1="828" y1="328" x2="858" y2="328" marker-end="url(#ab)"/>
    <line x1="918" y1="133" x2="940" y2="133"/>
    <line x1="918" y1="208" x2="940" y2="208"/>
    <line x1="918" y1="328" x2="940" y2="328"/>
    <line x1="970" y1="133" x2="1008" y2="133" marker-end="url(#ab)"/>
    <line x1="970" y1="208" x2="1008" y2="208" marker-end="url(#ab)"/>
    <line x1="970" y1="328" x2="1008" y2="328" marker-end="url(#ab)"/>
  </g>
  <g font-size="13" fill="#2F5597" text-anchor="end">
    <text x="720" y="137">x<tspan font-size="9" dy="3">0</tspan></text>
    <text x="720" y="212">x<tspan font-size="9" dy="3">1</tspan></text>
    <text x="720" y="332">x<tspan font-size="9" dy="3">26</tspan></text>
  </g>
  <g fill="#DDEBF7" stroke="#2F5597" stroke-width="1.5">
    <rect x="770" y="110" width="58" height="46" rx="4"/>
    <rect x="860" y="110" width="58" height="46" rx="4"/>
    <rect x="1010" y="110" width="58" height="46" rx="4"/>
    <rect x="770" y="185" width="58" height="46" rx="4"/>
    <rect x="860" y="185" width="58" height="46" rx="4"/>
    <rect x="1010" y="185" width="58" height="46" rx="4"/>
    <rect x="770" y="305" width="58" height="46" rx="4"/>
    <rect x="860" y="305" width="58" height="46" rx="4"/>
    <rect x="1010" y="305" width="58" height="46" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="799" y="137">W<tspan font-size="9" dy="4">0,0</tspan></text>
    <text x="889" y="137">W<tspan font-size="9" dy="4">0,1</tspan></text>
    <text x="1039" y="137">W<tspan font-size="9" dy="4">0,25</tspan></text>
    <text x="799" y="212">W<tspan font-size="9" dy="4">1,0</tspan></text>
    <text x="889" y="212">W<tspan font-size="9" dy="4">1,1</tspan></text>
    <text x="1039" y="212">W<tspan font-size="9" dy="4">1,25</tspan></text>
    <text x="799" y="332">W<tspan font-size="9" dy="4">26,0</tspan></text>
    <text x="889" y="332">W<tspan font-size="9" dy="4">26,1</tspan></text>
    <text x="1039" y="332">W<tspan font-size="9" dy="4">26,25</tspan></text>
  </g>
  <g font-size="20" fill="#404040" text-anchor="middle">
    <text x="955" y="139">⋯</text>
    <text x="955" y="214">⋯</text>
    <text x="955" y="334">⋯</text>
    <text x="799" y="275">⋮</text>
    <text x="889" y="275">⋮</text>
    <text x="1039" y="275">⋮</text>
    <text x="955" y="275">⋱</text>
  </g>
  <g font-size="13" fill="#C55A11" text-anchor="middle">
    <text x="799" y="393">y<tspan font-size="9" dy="3">0</tspan></text>
    <text x="889" y="393">y<tspan font-size="9" dy="3">1</tspan></text>
    <text x="1039" y="393">y<tspan font-size="9" dy="3">25</tspan></text>
  </g>
  <text x="919" y="415" font-size="11" fill="#595959" text-anchor="middle">26 dot products per input vector → result memory</text>
  <line x1="690" y1="442" x2="722" y2="442" stroke="#2F5597" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="730" y="446" font-size="12">activations move right</text>
  <line x1="880" y1="442" x2="912" y2="442" stroke="#C55A11" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="920" y="446" font-size="12">partial sums move down</text>
  <text x="690" y="470" font-size="12">Each PE: psum<tspan font-size="9" dy="3">out</tspan><tspan dy="-3"> = psum</tspan><tspan font-size="9" dy="3">in</tspan><tspan dy="-3"> + x · W   (W stays fixed in the PE)</tspan></text>
</svg>
